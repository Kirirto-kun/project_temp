services:
  postgres:
    image: postgres:17.12-alpine
    network_mode: bridge
    environment:
      POSTGRES_DB: holdline
      POSTGRES_USER: holdline
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Run npm run setup:local first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - intake_pg:/var/lib/postgresql/data
      - ./db/init-test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdline -d holdline"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  intake_pg:
