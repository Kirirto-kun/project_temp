<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 32" width="280" height="64" role="img" aria-label="Holdline">
  <!-- Option A, "Crossline": two posts (the two sides) and one line that runs through both and past them.
       Reads as an H for Holdline; the line is held level across the gap. -->
  <rect width="32" height="32" rx="8" fill="#5b42f3"/>
  <rect x="9" y="8" width="4" height="16" rx="2" fill="#fff"/>
  <rect x="19" y="8" width="4" height="16" rx="2" fill="#fff"/>
  <rect x="4.5" y="13.5" width="23" height="3" rx="1.5" fill="#fff"/>
  <text x="42" y="23.5" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.9" fill="#110e24">Holdline</text>
</svg>
